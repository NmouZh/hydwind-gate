name: HydwindGate
version: '${version}'
main: me.hydwind.gate.HydwindGatePlugin
api-version: '26.3'
authors: [NmouZh]
description: 氢风进服门禁插件
website: https://github.com/NmouZh/hydwind-gate

commands:
  login:
    description: 打开登录对话框，或直接提交登录码
    usage: "/login [登录码]"
    permission: hydwindgate.login
  hydwind:
    description: 登录门禁管理命令
    usage: "/hydwind <status|reload|approve <玩家>|kick <玩家>>"

permissions:
  hydwindgate.login:
    description: 允许使用 /login
    default: true
  hydwind.admin:
    description: 允许使用 /hydwind 管理命令
    default: op