    session-not-found: "没有找到玩家 {player} 的登录会话。"
    already-authenticated: "玩家 {player} 已经通过认证。"
    approved-player: "管理员已手动放行你的登录。"
    approved: "已放行玩家 {player}。"
    kicked-player: "你已被管理员踢出服务器。"
