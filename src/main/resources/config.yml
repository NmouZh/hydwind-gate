# HydwindGate 配置。
# 修改后可通过 /hydwind reload 热重载（该命令由后续 ticket 提供）。

website:
  # 网站根地址，插件据此拼接 /gate、/api/health 与 /api/plugin/login/verify。
  base-url: "http://103.236.99.253:62179"
  # 网站插件令牌，与站务令牌分离。首次部署时填入。
  # 环境变量 HYDWIND_PLUGIN_TOKEN 非空时优先于此处。
  token: ""
  # HTTP 连接与读取超时，单位毫秒。
  connect-timeout-millis: 3000
  read-timeout-millis: 5000

login:
  # PENDING / VERIFYING 会话超过该秒数会被踢出。
  timeout-seconds: 300
  # 已认证玩家断线后，同 UUID + 同 IP 在此秒数内重连免登录。
  reconnect-grace-seconds: 300

spawn:
  # 登录冻结期间玩家被传送到的位置。
  world: "world"
  x: 0.0
  y: 64.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

messages:
  # {url} 会替换为网站 /gate 地址，{name} 会替换为中文别名（没有则用账号名）。
  gate-title: "氢风门禁"
  gate-prompt: "请在浏览器打开 {url} 登录账号，然后复制颜文字登录码粘贴到下面的输入框 (｡･ω･｡)"
  code-label: "登录码"
  submit-button: "提交验证"
  submit-tooltip: "提交对话框中的登录码或备用码"
  reopen-button: "重新打开网站"
  reopen-tooltip: "重新打开登录对话框"
  login-success: "登录成功，欢迎回来，{name}！(๑•̀ㅂ•́)و✧"
  service-unavailable: "认证服务暂时不可用，请稍后重试。"
  service-misconfigured: "认证服务配置异常，请联系管理员。"
  session-timeout: "登录超时，请重新进服完成认证。"
  invalid-code: "登录码不存在，请检查后重新输入。"
  expired-code: "登录码已过期，请回到网站重新获取。"
  used-code: "登录码已被使用，请回到网站重新获取。"
  game-id-mismatch: "网站账号名与你的游戏 ID 不一致，请使用与游戏 ID 相同的账号登录。"
  empty-code: "请先填写登录码，或使用 /login <登录码>。"
  verifying: "正在验证登录码，请稍候…"
  already-authenticated: "你已经完成认证，可以直接游戏。"