name: CI

on:
  push:
    branches:
      - main
      - feat/login-gate
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - feat/login-gate
      - feat/velocity-gate
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          # Gradle 9.7 系列的正式发行版为 9.7.0。
          gradle-version: '9.7.0'

      - name: Build
        # 构建本身允许缓存；LimboAPI 下载任务带 SHA-256 校验，避免每次 rerun 都依赖 GitHub CDN。
        run: gradle build --no-build-cache

      - name: Run tests without Gradle test cache
        # 单独重跑测试，确保下面的 JUnit XML 是本次真实执行，而不是缓存恢复的旧结果。
        run: gradle test --rerun-tasks --no-build-cache

      - name: Report JUnit test count
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob('build/test-results/test/TEST-*.xml')
          if not files:
              print('::error::No JUnit result files found; gradle build did not execute tests')
              sys.exit(1)

          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in files:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))

          print(
              f"JUnit results: {len(files)} suites, {totals['tests']} tests, "
              f"{totals['failures']} failures, {totals['errors']} errors, "
              f"{totals['skipped']} skipped"
          )
          if totals['tests'] == 0:
              print('::error::No tests were executed')
              sys.exit(1)
          if totals['failures'] or totals['errors']:
              print('::error::Test failures were reported')
              sys.exit(1)
          PY

      - name: Verify Velocity plugin metadata is packaged
        run: |
          set -euo pipefail
          jar_file=$(ls build/libs/*.jar | head -n 1)
          unzip -l "$jar_file" | grep -q ' velocity-plugin.json$'
          echo "velocity-plugin.json found in $jar_file"

      - name: Verify LimboAPI dependency was downloaded and checksummed
        run: |
          set -euo pipefail
          test -s build/limboapi/limboapi-1.2.0.jar
          ls -l build/limboapi/limboapi-1.2.0.jar
          # `gradle build` 通过 verifyLimboApi 任务完成校验；这里确认文件仍在。

      - name: Upload plugin jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hydwind-gate
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30