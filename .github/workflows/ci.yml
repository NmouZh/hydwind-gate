name: CI

on:
  push:
    branches:
      - feat/login-gate
      - 'feat/**'
  pull_request:
    branches:
      - feat/login-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          # Gradle 9.7 系列的正式发行版为 9.7.0。
          gradle-version: '9.7.0'

      - name: Build
        run: gradle build

      - name: Verify plugin.yml is packaged
        run: |
          set -euo pipefail
          jar_file=$(ls build/libs/*.jar | head -n 1)
          unzip -l "$jar_file" | grep -q ' plugin.yml$'
          echo "plugin.yml found in $jar_file"
